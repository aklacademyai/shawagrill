<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAWA CEO — новый пароль</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#faf7f0; color:#23231f; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.08); padding:28px 24px; width:min(92vw, 360px); }
  h1 { font-size:20px; margin:0 0 6px; }
  p { font-size:14px; color:#6b675c; margin:0 0 18px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:1px solid #ddd6c6; border-radius:10px; }
  button { width:100%; margin-top:20px; padding:13px; font-size:16px; font-weight:700; color:#fff; background:#c9973f; border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.55; }
  .err { color:#b3261e; font-size:14px; min-height:18px; margin-top:12px; }
  .ok { color:#14402f; font-size:15px; }
</style>
</head>
<body>
<div class="card">
  <h1>Новый пароль</h1>
  <p>SHAWA CEO · задайте новый пароль для входа владельца. Минимум 6 символов.</p>
  <form id="f">
    <label for="p1">Новый пароль</label>
    <input id="p1" type="password" autocomplete="new-password" required minlength="6">
    <label for="p2">Повторите пароль</label>
    <input id="p2" type="password" autocomplete="new-password" required minlength="6">
    <button id="b" type="submit">Сохранить и войти</button>
    <div class="err" id="e"></div>
  </form>
</div>
<script>
  const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  const err = document.getElementById('e');
  if (!token) { err.textContent = 'В ссылке нет токена. Запросите ссылку ещё раз.'; document.getElementById('b').disabled = true; }
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1 !== p2) { err.textContent = 'Пароли не совпадают.'; return; }
    const btn = document.getElementById('b'); btn.disabled = true; btn.textContent = 'Сохраняю…';
    try {
      const r = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, password: p1 }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'Не получилось. Попробуйте ещё раз.');
      localStorage.setItem('shawa_ceo_token', data.token);
      document.querySelector('.card').innerHTML = '<div class="ok">✅ Пароль изменён. Вхожу в панель…</div>';
      setTimeout(() => location.replace('/'), 700);
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false; btn.textContent = 'Сохранить и войти';
    }
  });
</script>
</body>
</html>
