<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHAWA HALAL GRILL — table ordering</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E63312">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHAWA">
<style>
  :root{
    --ink:#211D12; --gold:#F07D0A; --gold2:#FFC500; --cream:#F6E7C1; --green:#0B6B3C; --terra:#E63312;
    --bg:#F7E9C8; --card:#FFFCF2; --muted:#7C6A45; --line:#E3CB8E; --red:#E63312;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#DCC794;color:var(--ink)}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(33,29,18,.25)}
  header{background:var(--ink);color:var(--cream);padding:14px 16px 12px;position:sticky;top:0;z-index:30}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#E63312,#FFC500 50%,#E63312);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-size:10px;letter-spacing:2.5px;color:var(--cream);font-weight:600;opacity:.9}
  .halal{background:var(--green);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:4px 8px;border-radius:6px}
  .tableno{display:inline-flex;align-items:baseline;gap:6px;background:linear-gradient(95deg,#E63312,#F07D0A 55%,#FFC500);color:#211D12;padding:5px 12px 7px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .tableno b{color:#211D12;font-family:'Archivo Black',sans-serif;font-size:23px;line-height:1}
  .tableno.mode b{font-size:14.5px;font-family:inherit;font-weight:800}
  .tBanner{display:flex;align-items:center;gap:12px;margin:12px 16px 2px;background:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:12px 16px;color:var(--cream)}
  .tBanner .tbIco{font-size:30px;line-height:1}
  .tBanner .tbLbl{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.85}
  .tBanner .tbNum{font-family:'Archivo Black',sans-serif;font-size:36px;line-height:1;color:var(--gold2);margin-left:auto;white-space:nowrap}
  .langrow{display:flex;gap:6px;margin-top:10px;align-items:center}
  .langlbl{font-size:11px;letter-spacing:1.5px;color:var(--cream);opacity:.75;font-weight:700;margin-right:2px}
  .langbtn{border:1.5px solid rgba(246,231,193,.4);background:transparent;color:var(--cream);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:800;cursor:pointer}
  .langbtn.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .hbtns{display:flex;gap:8px;margin-top:9px}
  .hbtn{flex:1;border:1px solid rgba(246,231,193,.4);background:transparent;color:var(--cream);border-radius:10px;padding:9px 6px;font-size:13px;font-weight:700;cursor:pointer}
  .hbtn.call{border-color:var(--gold);color:var(--gold2)}
  .hbtn.call.active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .hbtn:active{transform:scale(.98)}
  nav.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  nav.cats::-webkit-scrollbar{display:none}
  .cat{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer}
  .cat.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
  main{flex:1;padding:8px 16px 110px}
  .catTitle{font-size:17px;font-weight:900;margin:16px 0 10px;letter-spacing:.3px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
  .item .info{flex:1}
  .item h3{font-size:15.5px;font-weight:800}
  .item p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .item .price{font-size:15px;font-weight:900;color:var(--ink);margin-top:7px}
  .item .price span{color:#B57E04}
  .addbtn{background:var(--ink);color:var(--gold2);border:none;width:38px;height:38px;border-radius:12px;font-size:21px;font-weight:900;cursor:pointer;flex-shrink:0}
  .addbtn:active{transform:scale(.94)}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;padding:2.5px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
  .tag.hit{background:var(--gold);color:var(--ink)}
  .tag.hot{background:var(--terra);color:#fff}
  .tag.veg{background:var(--green);color:#fff}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--ink);display:flex;z-index:40;border-top:2px solid var(--gold)}
  .tabbar button{flex:1;background:none;border:none;color:var(--cream);padding:11px 4px 13px;font-size:12px;font-weight:700;cursor:pointer;position:relative;opacity:.75}
  .tabbar button.on{opacity:1;color:var(--gold2)}
  .badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--terra);color:#fff;font-size:10.5px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .secttl{font-size:13px;font-weight:800;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin:18px 0 9px}
  .line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .line .r1{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:700}
  .line .mods{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .line .r2{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
  .qty{display:flex;align-items:center;gap:11px}
  .qty button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;font-weight:900;cursor:pointer}
  .qty b{font-size:15px;min-width:16px;text-align:center}
  .status{font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:999px}
  .st-new{background:#FFD23F;color:#6B4E00}
  .st-cooking{background:#FF9E45;color:#7A3800}
  .st-ready{background:var(--green);color:#fff}
  .st-served{background:#E4D6A8;color:#6E5F33}
  .totals{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:12px}
  .totals .tr{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#4c4230}
  .totals .tr.grand{font-size:17px;font-weight:900;color:var(--ink);border-top:1px dashed var(--line);margin-top:7px;padding-top:10px}
  .bigbtn{width:100%;background:var(--gold);color:var(--ink);border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;margin-top:12px;letter-spacing:.3px}
  .bigbtn.dark{background:var(--ink);color:var(--gold2)}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .bigbtn:active{transform:scale(.99)}
  .ghostbtn{width:100%;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:9px}
  .empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:14.5px;line-height:1.6}
  .empty .big{font-size:38px;display:block;margin-bottom:8px}
  .overlay{position:fixed;inset:0;background:rgba(33,29,18,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .sheet h2{font-size:19px;font-weight:900}
  .sheet .desc{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .opttl{font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:17px 0 8px}
  .opt{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;font-size:14.5px;font-weight:600;cursor:pointer}
  .opt.sel{border-color:var(--gold);background:#FCEFC4}
  .opt .plus{color:var(--muted);font-weight:700;font-size:13px}
  .opt .tick{color:#B57E04;font-weight:900}
  .sheet .foot{display:flex;gap:10px;align-items:center;margin-top:20px}
  .sheet .foot .qty button{width:38px;height:38px;font-size:19px}
  .sheet .foot .bigbtn{margin-top:0;flex:1}
  .tips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .tip{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 2px;text-align:center;font-weight:800;font-size:14px;cursor:pointer}
  .tip.sel{border-color:var(--gold);background:#FCEFC4}
  .paymethod{display:flex;gap:8px}
  .paymethod .opt{flex:1;justify-content:center}
  .stars{display:flex;gap:6px;justify-content:center;font-size:36px;margin:10px 0}
  .stars span{cursor:pointer;color:#DECD96}
  .stars span.on{color:var(--gold)}
  .kbatch{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 13px;margin-bottom:11px}
  .kbatch.ready{border-left-color:var(--green)}
  .kbatch .kh{display:flex;justify-content:space-between;align-items:center}
  .kbatch .kt{font-size:16px;font-weight:900}
  .kbatch .timer{font-size:12.5px;font-weight:800;color:var(--terra)}
  .kbatch ul{list-style:none;margin-top:8px}
  .kbatch li{font-size:14px;padding:3.5px 0;border-bottom:1px dashed var(--line)}
  .kbatch li:last-child{border-bottom:none}
  .kbatch li .mods{display:block;font-size:12px;color:var(--muted)}
  .kbatch .bigbtn{margin-top:10px;padding:12px;font-size:14.5px}
  .kcall{background:#FFE8CF;border:1.5px solid var(--terra);border-radius:14px;padding:12px 13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .kcall b{font-size:15px}
  .kcall button{background:var(--terra);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
  .toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .tablesgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .tcard b{font-size:16px}
  .tcard .st{display:block;font-size:12px;color:var(--muted);margin:4px 0 9px}
  .tcard button{background:var(--ink);color:var(--gold2);border:none;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:800;cursor:pointer;margin-right:6px}
  .tcard button.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(33,29,18,.25);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}



  .startlogo{font-size:52px;font-weight:900;letter-spacing:1px;background:linear-gradient(95deg,#E63312,#F07D0A 45%,#FFC500 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:10px}
  .startsub{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted)}
  .startslogan{font-size:17px;font-weight:800;margin:12px 0 22px}
  .ordernow{width:100%;border:0;border-radius:16px;padding:19px;font-size:20px;font-weight:900;letter-spacing:.5px;color:#fff;cursor:pointer;background:linear-gradient(95deg,#E63312,#F07D0A 55%,#FFC500);box-shadow:0 8px 22px rgba(230,51,18,.35)}
  .modecard{display:flex;width:100%;font:inherit;color:inherit;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:11px;cursor:pointer;text-align:left}
  .modecard:active{border-color:#E63312}
  .modecard .mic{font-size:32px}
  .modecard .mtx{display:flex;flex-direction:column;gap:2px}
  .modecard .mtx b{font-size:18px}
  .modecard .mtx small{color:var(--muted);font-size:13px}

  .ttgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tt{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 8px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 10px rgba(35,35,31,.06)}
  .tt:active{border-color:#E63312;background:#FFF1DE}
  .tt .ttn{font-size:42px;font-weight:900;line-height:1;color:var(--ink)}
  .tt .ttl{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted)}
  .barrow{display:flex;align-items:center;gap:9px;font-size:13px;margin:5px 0}
  .barrow .bl{width:110px;font-weight:700;flex-shrink:0}
  .barrow .bt{flex:1;height:12px;background:#EFE3C2;border-radius:6px;overflow:hidden}
  .barrow .bt i{display:block;height:100%;background:linear-gradient(90deg,#E63312,#F07D0A,#FFC500)}
  .barrow .bv{width:64px;text-align:right;font-weight:800}
  .camgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .camtile{background:#191712;border-radius:12px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#CFC4A6;gap:5px;cursor:pointer;border:1px solid #3A382E}
  .camtile .ci{font-size:26px}
  .camtile .cl{font-size:12px;font-weight:800;letter-spacing:1px}
  .camtile .cs{font-size:10.5px;color:#8B8371}
  .txtin{flex:1;font-size:14px;font-weight:700;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);min-width:0}
  .pininput{width:100%;font-size:22px;letter-spacing:8px;text-align:center;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:900;color:var(--ink)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .stat .v{font-size:21px;font-weight:900}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
  .priceinp{width:86px;font-size:14px;font-weight:800;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .mini{background:var(--ink);color:var(--gold2);border:none;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:800;cursor:pointer}
  .mini.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
  .mini.stop{background:#F6D9CF;color:#8F2B0E;border:1.5px solid var(--terra)}
  .mini.go{background:var(--green);color:#fff}
  .logohimg{height:40px;width:auto;display:block}
  .signlogo{height:48px;width:auto;display:block;border-radius:10px}
  .startlogoimg{width:min(330px,86vw);display:block;margin:4px auto 6px}
  .receipt{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:15px;margin-top:12px}
  .promobanner{display:block;width:100%;border:0;border-radius:18px;padding:22px 18px 20px;margin-top:16px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(120deg,#E63312,#F07D0A 55%,#FFC500);box-shadow:0 10px 26px rgba(230,51,18,.35)}
  .promobanner:active{transform:scale(.99)}
  .promobanner .pstars{font-size:22px;letter-spacing:6px;color:#FFE9A8;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .promobanner .ptitle{font-size:30px;font-weight:900;letter-spacing:.5px;margin:7px 0 6px;font-family:'Archivo Black','Manrope',sans-serif}
  .promobanner .ptext{font-size:14.5px;font-weight:700;line-height:1.45}

  :root{color-scheme:light dark}
  .logo,.startlogo,.catTitle{font-family:'Archivo Black','Manrope',sans-serif}
  .logo .lgw{background:linear-gradient(90deg,#E63312,#FFC500 55%,#E63312);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .lgflame{display:inline-block;line-height:0}
  .logo .lgflame img{height:27px;width:auto;vertical-align:-5px}
  /* SIGN LOCKUP v4 — вариант с вывески: пламя сверху, SHAWA / GRILL стопкой, оранжевая черта */
  .logo-stack{display:inline-flex;flex-direction:column;align-items:stretch;line-height:1}
  .logo-stack .ls-flame{height:31px;width:auto;align-self:center;margin-bottom:5px}
  .logo-stack .ls-words{display:flex;flex-direction:column;font-size:27px;letter-spacing:3px;color:var(--ink);line-height:1.05}
  .logo-stack .ls-line{height:5px;border-radius:2px;background:linear-gradient(90deg,#E63312,#F07D0A 60%,#FFC500);margin-top:6px}
  .startbrand{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
  .startbrand .startlogo{font-size:min(52px,11vw);margin-top:0}
  .startflame{height:min(56px,12vw);width:auto}
  .startsub{text-align:center;margin-top:6px}
  .startslogan{text-align:center}
  .signimg{width:min(450px,94vw);border-radius:16px;box-shadow:0 10px 30px rgba(33,29,18,.35)}
  .item .ph{width:88px;height:88px;border-radius:13px;overflow:hidden;flex-shrink:0;position:relative;cursor:pointer;background:linear-gradient(135deg,#E63312,#F07D0A 55%,#FFC500)}
  .item .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .phflame{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:32px}
  .noimg .phflame{display:flex}
  .sheetph{margin:-20px -18px 14px;height:215px;overflow:hidden;position:relative;background:linear-gradient(120deg,#E63312,#F07D0A 55%,#FFC500)}
  .sheetph img{width:100%;height:100%;object-fit:cover;display:block}
  .sheetph .phflame{font-size:52px}
  .optimg{width:36px;height:36px;border-radius:9px;object-fit:cover;vertical-align:-12px;margin-right:9px}
  .qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .qrcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;page-break-inside:avoid}
  .qrcard .qrbox{background:#fff;border-radius:10px;padding:9px;margin-bottom:9px}
  .qrcard .qrbox svg{width:100%;height:auto;display:block}
  .qrcard b{display:block;font-size:16px}
  .qrcard span{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  @media (prefers-color-scheme: dark){
    :root{--bg:#26200F;--card:#2F2817;--ink:#F4EAD0;--muted:#B7A67F;--line:#4C4023}
    body{background:#131009}
    #app{box-shadow:none}
    .opt.sel,.tip.sel{background:#4A3A13}
    .kcall{background:#3B2A15}
    .st-served{background:#4C4023;color:#DCCB96}
    .totals .tr{color:#CDBE93}
    .barrow .bt{background:#4C4023}
    .qty button{background:var(--card);color:var(--ink)}
    .empty{color:var(--muted)}
  }
  @media print{
    header,.tabbar,nav.cats,.hbtns,.langrow{display:none!important}
    body{background:#fff}
    #app{box-shadow:none;max-width:100%}
  }

.searchrow{display:flex;gap:7px;margin:10px 0 4px}
.searchin{flex:1;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
.fchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.tag.newb{background:#2E7D32;color:#fff}
.tag.day{background:#7B1FA2;color:#fff}

function loadStore(){
  try{ return JSON.parse(LS.getItem('shawa_orders_v1')) || {tables:{}, reviews:[]}; }
  catch(e){ return {tables:{}, reviews:[]}; }
}
function saveStore(s){ LS.setItem('shawa_orders_v1', JSON.stringify(s)); }
function getTab(create){
  const s = loadStore();
  if(!s.tables[tableId]){
    if(!create) return {store:s, tab:null};
    s.tables[tableId] = {openedAt:Date.now(), items:[], calls:[], paid:false, batch:0};
    saveStore(s);
  }
  return {store:s, tab:s.tables[tableId]};
}
function loadCart(){
  try{ return JSON.parse(LS.getItem('shawa_cart_'+tableId)) || []; }catch(e){ return []; }
}
function saveCart(c){ LS.setItem('shawa_cart_'+tableId, JSON.stringify(c)); }
function migrateNames(line){
  /* старые строки демо (имя-строка) → объект имён */
  if(typeof line.name === 'string'){ line.names = {en:line.name, ru:line.name, es:line.name}; delete line.name; }
  if(!Array.isArray(line.mods)) line.mods = [];
  line.mods = line.mods.map(m => typeof m === 'string' ? {raw:m} : m);
  return line;
}
function modText(m){
  if(m.raw) return m.raw;
  if(m.t==='size') return T('sizeLarge');
  if(m.t==='spice') return T('spice')[m.v];
  if(m.t==='extra'){ const e = WRAP_EXTRAS.find(w=>w.id===m.v); return e ? '+ '+L(e.name) : m.v; }
  if(m.t==='no'){ const r = WRAP_REMOVE.find(w=>w.id===m.v); return r ? L(r.name) : m.v; }
  return '';
}

function itemById(id){ for(const c of effMenu()) for(const it of c.items) if(it.id===id) return it; return null; }
let LIVE_MENU = null;
function effMenu(){
  const s = loadStore();
  const hidden = new Set(s.hiddenItems||[]);
  const ov = s.nameOverrides||{};
  const cats = (LIVE_MENU || MENU).map(c=>({cat:c.cat, items:c.items.filter(it=>!hidden.has(it.id)).map(it=>ov[it.id]?{...it, name:{...it.name, ...ov[it.id]}}:it)}));
  (s.customItems||[]).forEach(ci=>{ if(cats[ci.cat]) cats[ci.cat].items.push(ci); });
  return cats;
}

  $('#menuMain').innerHTML = `
    <div class="searchrow"><input class="searchin" id="menuSearch" placeholder="${T('searchPh')}" value="${menuQuery.replace(/"/g,'&quot;')}"></div>
    <div class="fchips">${[['all','fAll'],['hit','fHit'],['hot','fHot'],['veg','fVeg'],['new','fNew']].map(f=>`<button class="fchip ${menuFilter===f[0]?'on':''}" data-filter="${f[0]}">${T(f[1])}</button>`).join('')}</div>
    <div id="menuList"></div>` + legalFooterHtml();
  const si = $('#menuSearch');
  if(si) si.addEventListener('input', ()=>{ menuQuery = si.value; renderMenuList(); });
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ menuFilter = b.dataset.filter; renderMenu(); });

}
function badgesHtml(it, dd){
  return `${it.tag?`<span class="tag ${TAGCLS[it.tag]}">${T(TAGKEY[it.tag])}</span>`:''}${it.fresh?`<span class="tag newb">${T('tagNew')}</span>`:''}${dd===it.id?`<span class="tag day">⭐ ${T('dishDay')}</span>`:''}`;
}

function renderMenuList(){
  const em = effMenu(); const s = loadStore(); const dd = s.settings && s.settings.dishOfDay;
  const q = menuQuery.trim().toLowerCase();
  const match = it => {
    if(menuFilter==='new' && !it.fresh) return false;
    if(menuFilter!=='all' && menuFilter!=='new' && it.tag!==menuFilter) return false;
    if(q && !['en','ru','es'].some(lg=>(it.name[lg]||'').toLowerCase().includes(q))) return false;
    return true;
  };
  const itemHtml = it => `
    <div class="item">
      <div class="ph ${it.img?'':'noimg'}" data-open="${it.id}">${it.img?`<img src="${it.img}" alt="${L(it.name)}" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()">`:''}<span class="phflame">🔥</span></div>
      <div class="info">
        <h3>${L(it.name)}${badgesHtml(it, dd)}</h3>
        <p>${L(it.desc)}</p>
        ${ALG[it.id]?`<div class="alg">⚠ ${T('allergens')}${L(ALG[it.id])}</div>`:''}
        <div class="price">${money(priceOf(it))}${it.wrap?` <span>${T('options')}</span>`:''}</div>
      </div>
      <button class="addbtn" data-add="${it.id}">+</button>
    </div>`;
  let listHtml = '';
  if(q || menuFilter!=='all'){
    em.forEach(c=>{ const its = c.items.filter(match); if(its.length) listHtml += `<div class="catTitle">${L(c.cat)}</div>` + its.map(itemHtml).join(''); });
    if(!listHtml) listHtml = `<div class="empty">${T('nothingYet')}</div>`;
  } else {
    const c = em[activeCat] || em[0];
    listHtml = `<div class="catTitle">${L(c.cat)}</div>` + c.items.map(itemHtml).join('');
  }

/* ===================== ЛИСТ ТОВАРА ===================== */
function openSheet(id){
  sheetItem = itemById(id); sheetQty = 1; sheetSize = 0; sheetSpice = 0;
  sheetExtras = new Set(); sheetRemove = new Set();
  renderSheet(); $('#itemOverlay').classList.add('open');
}
function closeSheet(){ $('#itemOverlay').classList.remove('open'); }
function sheetUnitPrice(){
  let p = priceOf(sheetItem) + (sheetItem.wrap ? sheetSize*3 : 0);
  sheetExtras.forEach(x=>{ const e = WRAP_EXTRAS.find(w=>w.id===x); if(e) p += e.price; });
  return p;
}
function renderSheet(){
  const it = sheetItem;
  let html = `${it.img?`<div class="sheetph"><img src="${it.img}" alt="${L(it.name)}" onerror="this.parentNode.classList.add('noimg');this.remove()"><span class="phflame">🔥</span></div>`:''}<h2>${L(it.name)}</h2><div class="desc">${L(it.desc)}</div>
    <div class="opttl">${T('price')}</div><div style="font-size:17px;font-weight:900">${money(priceOf(it))}</div>`;
  if(it.wrap){
    html += `<div class="opttl">${T('size')}</div>
      <div class="opt ${sheetSize===0?'sel':''}" data-size="0">${T('sizeReg')} <span class="plus">${money(priceOf(it))}</span></div>
      <div class="opt ${sheetSize===1?'sel':''}" data-size="1">${T('sizeLarge')} <span class="plus">+ ${money(3)}</span></div>
      <div class="opttl">${T('heat')}</div>` +
      T('spice').map((s,i)=>`<div class="opt ${sheetSpice===i?'sel':''}" data-spice="${i}">${s}${sheetSpice===i?'<span class="tick">✓</span>':''}</div>`).join('') +
      `<div class="opttl">${T('add')}</div>` +
      WRAP_EXTRAS.map(e=>`<div class="opt ${sheetExtras.has(e.id)?'sel':''}" data-extra="${e.id}"><span>${e.img?`<img class="optimg" src="${e.img}" alt="" loading="lazy" onerror="this.remove()">`:''}${L(e.name)}</span><span class="plus">+ ${money(e.price)}</span></div>`).join('') +
      `<div class="opttl">${T('remove')}</div>` +
      WRAP_REMOVE.map(r=>`<div class="opt ${sheetRemove.has(r.id)?'sel':''}" data-remove="${r.id}">${L(r.name)}${sheetRemove.has(r.id)?'<span class="tick">✓</span>':''}</div>`).join('');
  }
    const prs = pairsFor(it);
  if(prs.length) html += `<div class="opttl">${T('pairsWith')}</div><div class="upsell">${prs.map(upCardHtml).join('')}</div>`;
  if(ALG[it.id]) html += `<div class="alg" style="margin-top:12px">⚠ ${T('allergens')}${L(ALG[it.id])}</div>`;
  html += `<div class="foot">
      <div class="qty"><button id="qMinus">−</button><b>${sheetQty}</b><button id="qPlus">+</button></div>
      <button class="bigbtn" id="sheetAdd">${T('addToCart')} · ${money(sheetUnitPrice()*sheetQty)}</button>
    </div>
    <button class="ghostbtn" id="sheetClose">${T('cancel')}</button>`;
  $('#itemSheet').innerHTML = html;
  bindUpsell($('#itemSheet'));
  document.querySelectorAll('[data-size]').forEach(o=>o.onclick=()=>{ sheetSize=+o.dataset.size; renderSheet(); });
  document.querySelectorAll('[data-spice]').forEach(o=>o.onclick=()=>{ sheetSpice=+o.dataset.spice; renderSheet(); });
  document.querySelectorAll('[data-extra]').forEach(o=>o.onclick=()=>{ sheetExtras.has(o.dataset.extra)?sheetExtras.delete(o.dataset.extra):sheetExtras.add(o.dataset.extra); renderSheet(); });
  document.querySelectorAll('[data-remove]').forEach(o=>o.onclick=()=>{ sheetRemove.has(o.dataset.remove)?sheetRemove.delete(o.dataset.remove):sheetRemove.add(o.dataset.remove); renderSheet(); });
  $('#qMinus').onclick=()=>{ if(sheetQty>1) sheetQty--; renderSheet(); };
  $('#qPlus').onclick=()=>{ sheetQty++; renderSheet(); };
  $('#sheetClose').onclick=closeSheet;
  $('#sheetAdd').onclick=()=>{
    const mods = [];
    if(it.wrap){
      if(sheetSize===1) mods.push({t:'size', v:1});
      if(sheetSpice>0) mods.push({t:'spice', v:sheetSpice});
      sheetExtras.forEach(x=>mods.push({t:'extra', v:x}));
      sheetRemove.forEach(r=>mods.push({t:'no', v:r}));
    }
    const cart = loadCart();
    cart.push({uid:uid(), itemId:it.id, names:it.name, unit:sheetUnitPrice(), qty:sheetQty, mods});
    saveCart(cart); closeSheet(); updateBadge();
    toast(T('toastAdded') + L(it.name));
  };
}

}
function tabTotals(tab){
  const sub = tab.items.reduce((s,i)=>s + i.unit*i.qty, 0);

  return {sub, tax, total: sub+tax};
}
function modsLine(mods){
  const arr = (mods||[]).map(m=>modText(typeof m==='string'?{raw:m}:m)).filter(Boolean);

}

function sendOrder(){

function updateBadge(){

function doPay(){

const _algN = {en:'nuts', ru:'орехи', es:'frutos secos'};

const _algJoin = (...ps)=>({en:ps.map(p=>p.en).join(', '), ru:ps.map(p=>p.ru).join(', '), es:ps.map(p=>p.es).join(', ')});

function pairsFor(it){
  if(!it) return [];
  let ids = [];
  if(it.wrap) ids = ['sauce-narsharab','lemonade','fries'];
  else if(['plate-doner','plate-mix','bowl-ch'].includes(it.id)) ids = ['hummus','ayran','baklava'];
  else if(it.id==='fries' || it.id==='fries-garlic' || it.id==='fries-shawarma') ids = ['sauce-toum','soda'];
  else if(String(it.id).indexOf('sauce')===0) ids = ['ch-classic','fries'];
  else ids = ['kunafa','tea'];
  return ids.filter(x=>x!==it.id).map(x=>itemById(x)).filter(p=>p && !isStopped(p.id));
}
function upCardHtml(p){ return `<div class="upcard"><div class="un">${L(p.name)}</div><div class="up">${money(priceOf(p))}</div><button data-upadd="${p.id}">+ ${T('addBtn')}</button></div>`; }
function bindUpsell(scope){
  (scope||document).querySelectorAll('[data-upadd]').forEach(b=>b.onclick=()=>{
    const p = itemById(b.dataset.upadd); if(!p) return;
    const cart = loadCart();
    cart.push({uid:uid(), itemId:p.id, names:p.name, unit:priceOf(p), qty:1, mods:[]});
    saveCart(cart); updateBadge(); toast(T('toastAdded') + L(p.name));
    if(guestView==='tab') renderTab();
  });
}
function upsellForCart(cart, tabItems){
  const have = new Set();
  cart.forEach(l=>{ const id = itemIdByNames(l.names); if(id) have.add(id); });
  (tabItems||[]).forEach(i=>{ const id = itemIdByNames(i.names); if(id) have.add(id); });
  const out = [], seen = new Set();
  cart.forEach(l=>{ const id = itemIdByNames(l.names); const src = id ? itemById(id) : null; if(!src) return;
    pairsFor(src).forEach(p=>{ if(!have.has(p.id) && !seen.has(p.id)){ seen.add(p.id); out.push(p); } }); });
  return out.slice(0,4);
}
function beepReady(){
  try{ if(navigator.vibrate) navigator.vibrate([150,80,150]); }catch(e){}
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(); const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.07;
    o.start(); setTimeout(()=>{ try{ o.stop(); ctx.close(); }catch(e){} }, 350);
  }catch(e){}
}
function itemIdByNames(names){
  if(!names) return null;
  for(const c of effMenu()) for(const it of c.items){
    if(['en','ru','es'].some(lg=>it.name[lg] && names[lg] && it.name[lg]===names[lg])) return it.id;
  }
  return null;
}
function pickupOptions(sel){
  const out = []; const d = new Date(Date.now() + 30*60000);
  d.setSeconds(0,0);
  if(d.getMinutes() % 30) d.setMinutes(d.getMinutes() + (30 - d.getMinutes() % 30));
  for(let k=0;k<10;k++){
    const v = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    out.push(`<option value="${v}" ${sel===v?'selected':''}>${v}</option>`);
    d.setMinutes(d.getMinutes() + 30);
  }
  if(sel && !out.some(o=>o.indexOf('value="' + sel + '"')>=0)) out.push(`<option value="${sel}" selected>${sel}</option>`);
  return out.join('');
}

async function cloverReq(method, path, body){
  const c = getClover();
  const base = c.env==='prod' ? 'https://api.clover.com' : 'https://apisandbox.dev.clover.com';
  let r;
  try{ r = await fetch(base + path, {method, headers:{'Authorization':'Bearer ' + c.token, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined}); }
  catch(e){ throw new Error(T('clvCors')); }
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw new Error('HTTP ' + r.status + (t ? ' · ' + t.slice(0,160) : '')); }
  try{ return await r.json(); }catch(e){ return {}; }
}
const SHAWA_ORDER_API = 'https://shawa.work/api/public/order';
const SHAWA_PAY_API = 'https://shawa.work/api/public/pay';
const SHAWA_MENU_API = 'https://shawa.work/api/public/menu';
async function loadCloverMenu(){

      return { id: 'cv-' + ci.id, img: photoByName[k] || '', price: ci.priceCents / 100, tag: '', wrap: !!ci.wrap, name: { en: ci.name, ru: ci.name, es: ci.name }, desc: descByName[k] || { en: '', ru: '', es: '' } };

function webItemsFromLines(lines){
  const items = [];
  lines.forEach(l=>{
    const nm = (l.names && (l.names.en || Object.values(l.names)[0])) || 'Item';
    let suffix = '';
    (l.mods || []).forEach(m=>{
      if(m.t === 'size' && m.v === 1) suffix += ' (Large)';
      else if(m.t === 'spice' && m.v > 0) suffix += ' \u00b7 spice ' + m.v;
      else if(m.t === 'extra'){ const ex = WRAP_EXTRAS.find(w=>w.id===m.v); if(ex) suffix += ' + ' + ex.name.en; }
      else if(m.t === 'no'){ const rm = WRAP_REMOVE.find(w=>w.id===m.v); if(rm) suffix += ' \u00b7 ' + rm.name.en; }
    });
    items.push({ name: (nm + suffix).slice(0, 120), priceCents: Math.round((l.unit || 0) * 100), qty: Math.max(1, Math.min(10, l.qty || 1)) });
  });
  return items;
}
async function doPayOnline(btn){
  const {tab} = getTab(false); if(!tab) return;
  const items = webItemsFromLines(tab.items);
  if(!items.length) return;
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + T('processing');
  try{
    const r = await fetch(SHAWA_PAY_API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ table: Math.round(Number(tableId)), items }) });
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.ok && j.href){ try{ sessionStorage.setItem('shawa_pay_session', j.sessionId); }catch(e){} location.href = j.href; return; }
    throw new Error('HTTP ' + r.status);
  }catch(e){
    btn.disabled = false; btn.innerHTML = orig;
    toast(T('clvErr') + 'Online payment unavailable \u2014 pay at the restaurant');
  }
}
async function handlePayReturn(){
  const paid = params.get('paid'), fail = params.get('payfail');
  if(!paid && !fail) return;
  history.replaceState(null, '', location.pathname + '?table=' + encodeURIComponent(tableId || ''));
  if(fail){ toast(T('clvErr') + 'Payment not completed'); return; }
  try{ await fetch(SHAWA_PAY_API + '/confirm', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ sessionId: paid }) }); }catch(e){}
  const s = loadStore(); const tab = s.tables[tableId];
  if(tab && !tab.paid){
    const t = tabTotals(tab);
    tab.paid = true; tab.paidAt = Date.now(); tab.tip = 0; tab.gift = 0; tab.grand = t.total; tab.payMethod = 'card'; tab.paidOnline = true;
    saveStore(s); renderThanks(t, tab);
  }
}
async function backendPushOrder(lines, batchNo){
  const table = Math.round(Number(tableId));
  if(!(table >= 1 && table <= 15)) return false;
  const items = [];
  lines.forEach(l=>{
    const nm = (l.names && (l.names.en || Object.values(l.names)[0])) || 'Item';
    let suffix = '';
    (l.mods || []).forEach(m=>{
      if(m.t === 'size' && m.v === 1) suffix += ' (Large)';
      else if(m.t === 'spice' && m.v > 0) suffix += ' \u00b7 spice ' + m.v;
      else if(m.t === 'extra'){ const ex = WRAP_EXTRAS.find(w=>w.id===m.v); if(ex) suffix += ' + ' + ex.name.en; }
      else if(m.t === 'no'){ const rm = WRAP_REMOVE.find(w=>w.id===m.v); if(rm) suffix += ' \u00b7 ' + rm.name.en; }
    });
    items.push({ name: (nm + suffix).slice(0, 120), priceCents: Math.round((l.unit || 0) * 100), qty: Math.max(1, Math.min(10, l.qty || 1)) });
  });
  if(!items.length) return false;
  try{
    const r = await fetch(SHAWA_ORDER_API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ table, items, batch: batchNo }) });
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.ok){ cloverLogPush('\u2713 web order ' + (j.orderId || '') + ' \u00b7 Table ' + table); toast(T('clvOk') + (j.orderId || '')); return true; }
    cloverLogPush('\u2717 web order HTTP ' + r.status);
    return false;
  }catch(e){ cloverLogPush('\u2717 web order network'); return false; }
}
async function cloverPushOrder(lines, batchNo){
  if(await backendPushOrder(lines, batchNo)) return;
  const c = getClover(); if(!c.enabled || !c.mid || !c.token) return;
  try{
    const mode = tableId==='togo' ? 'togo' : tableId==='dlv' ? 'dlv' : 'table';
    const otId = (c.ot||{})[mode] || (c.orderTypes && c.orderTypes[0] && c.orderTypes[0].id) || '';
    if(!otId) throw new Error('No order type — open the Clover tab, test the connection and pick order types.');
    const lineItems = [];
    lines.forEach(l=>{
      const ourId = itemIdByNames(l.names); const cid = ourId ? (c.map||{})[ourId] : null;
      if(!cid) return;
      const mods = (l.mods||[]).filter(m=>m.t==='extra').map(m=>{
        const mid2 = (c.modMap||{})[m.v]; if(!mid2) return null;
        const ex = WRAP_EXTRAS.find(w=>w.id===m.v);
        return {modifier:{id:mid2, available:true}, amount: Math.round((ex ? ex.price : 0)*100)};
      }).filter(Boolean);
      for(let q=0;q<(l.qty||1);q++) lineItems.push({item:{id:cid}, printed:false, exchanged:false, modifications:mods});
    });
    if(!lineItems.length) throw new Error('No mapped items in this order — sync the menu in the Clover tab.');
    const created = await cloverReq('POST', `/v3/merchants/${c.mid}/atomic_order/orders`, {orderCart:{orderType:{id:otId}, lineItems, discounts:[]}});
    const oid = created && created.id;
    if(oid){
      const ref = 'SHAWA-' + tableId + '-' + batchNo + '-' + Date.now();
      await cloverReq('POST', `/v3/merchants/${c.mid}/orders/${oid}`, {title: tLabel(tableId), note: 'SHAWA WEB · ' + tLabel(tableId) + ' · batch ' + batchNo, externalReferenceId: ref, state:'open'});
    }
    cloverLogPush('✓ order ' + (oid||'?') + ' · batch ' + batchNo + ' · ' + tLabel(tableId));
    toast(T('clvOk') + (oid||''));
  }catch(e){
    cloverLogPush('✗ ' + e.message);
    toast(T('clvErr') + e.message);
  }
}
